name: governed-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governed-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.12 / governed validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Scan repository files for likely secrets
        run: python3 forge/check_secrets.py

      - name: Install locked CI dependencies and package
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-ci.lock
          python3 -m pip install --disable-pip-version-check --no-deps -e .
          python3 -m pip check

      - name: Validate Forge contracts
        run: python3 forge/validate_contracts.py

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -t . -v

      - name: Verify exported schemas are current
        run: |
          python3 scripts/export_schemas.py
          git diff --exit-code -- schemas/

      - name: Build wheel without dependency resolution
        env:
          PIP_NO_INDEX: "1"
        run: python3 -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
