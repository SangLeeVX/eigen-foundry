name: governed-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governed-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.12 / governed validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Scan repository files for likely secrets
        run: python3 forge/check_secrets.py

      - name: Scan reachable Git history for likely secrets
        run: python3 scripts/check_git_history.py

      - name: Install locked CI dependencies and package
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock
          PIP_NO_INDEX=1 python3 -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python3 -m pip check

      - name: Run governed validation without network access
        env:
          PIP_NO_INDEX: "1"
        run: make check
